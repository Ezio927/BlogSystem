# Included only inside the existing HTTPS server block.
location ~ ^/blog(?:/|$) {
    # Preserve /blog: Next.js is built with this basePath.
    proxy_pass http://100.76.66.55:3400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Overwrite, never trust a caller-supplied identity for chat rate limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This is a public reader; do not forward other apps' login credentials.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
